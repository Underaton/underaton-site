<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="A stack of wrapped gifts with £20, £50 and £100 price tags">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#ffffff" opacity=".18"/></pattern>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#ffffff" opacity=".14"/></pattern>
  </defs>
  <!-- glow -->
  <circle cx="270" cy="230" r="190" fill="#ffd23f" opacity=".08"/>
  <circle cx="270" cy="230" r="130" fill="#ffd23f" opacity=".07"/>
  <!-- confetti -->
  <g opacity=".9">
    <rect x="70" y="60" width="10" height="22" rx="3" fill="#ffd23f" transform="rotate(-25 75 71)"/>
    <rect x="450" y="80" width="10" height="22" rx="3" fill="#0e9f8e" transform="rotate(30 455 91)"/>
    <circle cx="420" cy="40" r="7" fill="#f0641c"/>
    <circle cx="110" cy="150" r="6" fill="#6d4aff"/>
    <rect x="470" y="200" width="10" height="22" rx="3" fill="#e8364f" transform="rotate(60 475 211)"/>
    <circle cx="60" cy="300" r="6" fill="#0e9f8e"/>
    <path d="M150 40l6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2z" fill="#ffd23f"/>
    <path d="M490 330l5 9 10 2-7 7 2 10-10-5-9 5 2-10-7-7 10-2z" fill="#ffd23f"/>
  </g>
  <!-- back gift (purple, £100) -->
  <g>
    <rect x="250" y="120" width="190" height="150" rx="14" fill="#6d4aff"/>
    <rect x="250" y="120" width="190" height="150" rx="14" fill="url(#dots)"/>
    <rect x="330" y="120" width="30" height="150" fill="#ffd23f"/>
    <rect x="240" y="98" width="210" height="40" rx="10" fill="#5a3ae0"/>
    <rect x="330" y="98" width="30" height="40" fill="#f2c62e"/>
    <path d="M345 98c-30-40-70-30-60-8 8 16 40 12 60 8zM345 98c30-40 70-30 60-8-8 16-40 12-60 8z" fill="#ffd23f"/>
  </g>
  <!-- left gift (orange, £50) -->
  <g>
    <rect x="110" y="205" width="170" height="160" rx="14" fill="#f0641c"/>
    <rect x="110" y="205" width="170" height="160" rx="14" fill="url(#stripes)"/>
    <rect x="182" y="205" width="26" height="160" fill="#ffffff" opacity=".9"/>
    <rect x="100" y="185" width="190" height="36" rx="10" fill="#d9540f"/>
    <rect x="182" y="185" width="26" height="36" fill="#f1f1f1"/>
    <path d="M195 185c-26-34-62-26-54-6 7 14 36 10 54 6zM195 185c26-34 62-26 54-6-7 14-36 10-54 6z" fill="#ffffff"/>
  </g>
  <!-- front gift (teal, £20) -->
  <g>
    <rect x="250" y="270" width="150" height="120" rx="14" fill="#0e9f8e"/>
    <rect x="250" y="270" width="150" height="120" rx="14" fill="url(#dots)"/>
    <rect x="312" y="270" width="24" height="120" fill="#e8364f"/>
    <rect x="242" y="252" width="166" height="32" rx="9" fill="#0b8576"/>
    <rect x="312" y="252" width="24" height="32" fill="#d22e45"/>
    <path d="M324 252c-22-30-54-22-47-5 6 12 31 9 47 5zM324 252c22-30 54-22 47-5-6 12-31 9-47 5z" fill="#e8364f"/>
  </g>
  <!-- small gift -->
  <g>
    <rect x="410" y="320" width="80" height="70" rx="10" fill="#ffd23f"/>
    <rect x="442" y="320" width="16" height="70" fill="#14161c" opacity=".85"/>
    <rect x="404" y="308" width="92" height="22" rx="7" fill="#f2c62e"/>
  </g>
  <!-- floor -->
  <rect x="80" y="388" width="420" height="6" rx="3" fill="#ffffff" opacity=".12"/>
  <!-- price tags -->
  <g font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800">
    <g transform="rotate(-12 120 180)">
      <path d="M78 160h70l16 20-16 20H78z" fill="#ffffff"/><circle cx="90" cy="180" r="5" fill="#14161c"/>
      <text x="124" y="190" font-size="26" text-anchor="middle" fill="#f0641c">£50</text>
    </g>
    <g transform="rotate(10 450 150)">
      <path d="M408 130h76l16 20-16 20h-76z" fill="#ffffff"/><circle cx="420" cy="150" r="5" fill="#14161c"/>
      <text x="458" y="160" font-size="26" text-anchor="middle" fill="#6d4aff">£100</text>
    </g>
    <g transform="rotate(-6 230 400)">
      <path d="M186 392h66l16 20-16 20h-66z" fill="#ffd23f"/><circle cx="198" cy="412" r="5" fill="#14161c"/>
      <text x="230" y="421" font-size="26" text-anchor="middle" fill="#14161c">£20</text>
    </g>
  </g>
</svg>
